<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HireHub — Jobs & Internships that fit</title><meta name="description" content="Find jobs and internships, hire talent, and manage applications on HireHub.">
<meta name="theme-color" content="#241539"><link rel="icon" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--p:#241539;--l:#C8F135;--b:#F4F1EA;--w:#fff;--m:#6B6078;--r:#FF6B57}
*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--p);font:16px/1.55 'Instrument Sans',system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',sans-serif;line-height:1.05;margin:0 0 .4em;letter-spacing:-.02em}
.n{font-family:'JetBrains Mono',monospace;font-weight:700;letter-spacing:-.03em}a{color:inherit}
header{background:var(--p);color:var(--b);position:sticky;top:0;z-index:9}
.bar{max-width:1120px;margin:auto;padding:10px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font:700 22px 'Bricolage Grotesque',system-ui,sans-serif}.logo img{width:38px;height:38px}.logo b{color:var(--l)}
.bar nav{display:flex;gap:6px;flex:1;flex-wrap:wrap}.bar a.l{padding:6px 12px;border-radius:99px;text-decoration:none;font-weight:600;font-size:14px}.bar a.l:hover{background:#ffffff1f}
.wrap{max-width:1120px;margin:auto;padding:28px 20px 60px}
.btn{display:inline-block;background:var(--l);color:var(--p);border:2px solid var(--p);border-radius:12px;padding:10px 18px;font:700 15px 'Instrument Sans',system-ui,sans-serif;cursor:pointer;text-decoration:none;box-shadow:3px 3px 0 var(--p);transition:.12s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--p)}.btn.d{background:var(--p);color:var(--b)}.btn.o{background:var(--w)}.btn.s{padding:6px 12px;font-size:13px;box-shadow:2px 2px 0 var(--p)}.btn.x{background:var(--r);color:#fff}
header .btn{border-color:var(--l);box-shadow:none}
.card{background:var(--w);border:2px solid var(--p);border-radius:16px;box-shadow:5px 5px 0 var(--p);padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.job{display:flex;flex-direction:column;gap:8px;text-decoration:none;transition:.12s}.job:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--p)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;border:1.5px solid var(--p);background:var(--b)}.tag.i{background:var(--l)}.tag.r{background:var(--r);color:#fff;border-color:var(--r)}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:30px;align-items:center;padding:24px 0 40px}
.hero h1{font-size:clamp(40px,7vw,78px)}.hero h1 em{font-style:normal;background:var(--l);padding:0 .12em;border-radius:10px}
.stat{background:var(--p);color:var(--b);border-radius:16px;padding:18px}.stat .n{font-size:40px;color:var(--l);display:block}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;padding:10px 12px;border:2px solid var(--p);border-radius:12px;background:var(--w);color:var(--p);width:100%}input:focus,select:focus,textarea:focus,.btn:focus-visible{outline:3px solid var(--l);outline-offset:1px}
label{font-weight:700;font-size:13px;display:block;margin:12px 0 4px}.f{max-width:460px;margin:30px auto}
.search{display:flex;gap:10px;flex-wrap:wrap;background:var(--w);border:2px solid var(--p);border-radius:18px;padding:10px;box-shadow:5px 5px 0 var(--p)}.search input{flex:1;min-width:160px;border:0;background:var(--b)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1.5px solid #e4dfd3;font-size:14px;vertical-align:middle}th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--m)}
.tabs{display:flex;gap:8px;margin:14px 0}.tabs button{font:inherit;border:2px solid var(--p);background:var(--w);border-radius:99px;padding:6px 16px;font-weight:700;cursor:pointer;color:var(--p)}.tabs button.on{background:var(--p);color:var(--l)}
.muted{color:var(--m)}.empty{text-align:center;padding:40px;color:var(--m)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--p);color:var(--l);padding:12px 22px;border-radius:12px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:99}#toast.on{opacity:1}
footer{background:var(--p);color:#b9aecb;text-align:center;padding:26px;font-size:14px}
@media(max-width:760px){.hero{grid-template-columns:1fr}.card{padding:16px}th:nth-child(n+4),td:nth-child(n+4){display:none}}
</style></head><body>
<header><div class="bar" id="nav"></div></header><main class="wrap" id="app"></main>
<footer>© HireHub — Jobs & internships, made simple.</footer><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),LS={g:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},s:(k,v)=>localStorage.setItem(k,JSON.stringify(v))};
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S=[['Frontend Developer','Pixelforge','Full-time','Hybrid','Bengaluru','₹14–22 LPA','React,TypeScript,CSS','Build fast, accessible interfaces for a design-led product team.'],
['Product Design Intern','Nova Labs','Internship','Remote','Remote','₹25k/mo','Figma,Research','Six months working with senior designers on live product features.'],
['Data Analyst','Quantly','Full-time','On-site','Mumbai','₹9–15 LPA','SQL,Python,Tableau','Turn messy business data into decisions that leaders trust.'],
['Backend Engineer','Cloudnine Pay','Full-time','Remote','Remote','₹20–34 LPA','Node.js,Postgres,AWS','Design reliable payment APIs used by thousands of merchants.'],
['Marketing Intern','Brightleaf','Internship','Hybrid','Pune','₹15k/mo','SEO,Writing,Social','Run campaigns, write copy and learn growth marketing hands-on.'],
['HR Executive','Talentry','Full-time','On-site','Ahmedabad','₹4–7 LPA','Recruiting,Excel','Own the hiring cycle from sourcing to offer letters.'],
['Machine Learning Engineer','Neurobyte','Full-time','Remote','Remote','₹24–40 LPA','Python,PyTorch,MLOps','Ship models into production and monitor how they behave.'],
['Software Engineering Intern','Gridwave','Internship','Remote','Remote','₹30k/mo','JavaScript,Git','Pair with mentors, fix real bugs and ship to production.'],
['Customer Success Associate','Helpdeck','Part-time','Remote','Remote','₹3–5 LPA','Communication,CRM','Help customers succeed and feed insights back to product.'],
['Content Writer','Inkwell Media','Contract','Remote','Remote','₹40k/mo','Writing,Editing','Long-form articles and case studies for B2B brands.'],
['DevOps Engineer','Stackyard','Full-time','Hybrid','Hyderabad','₹16–28 LPA','Docker,Kubernetes,CI/CD','Keep releases boring: automate pipelines and infrastructure.'],
['Finance Intern','Ledgerly','Internship','On-site','Ahmedabad','₹12k/mo','Excel,Accounting','Support month-end close and build budgeting models.']];
let db=LS.g('hh',null);
if(!db){db={users:[{id:1,name:'Admin',email:'admin@hirehub.app',pw:'admin123',role:'admin'},{id:2,name:'Nova Labs',email:'recruiter@hirehub.app',pw:'recruit123',role:'recruiter'},{id:3,name:'Aarav Shah',email:'seeker@hirehub.app',pw:'seeker123',role:'seeker'}],
jobs:S.map((j,i)=>({id:i+1,rid:2,title:j[0],co:j[1],type:j[2],mode:j[3],loc:j[4],pay:j[5],skills:j[6],desc:j[7],st:'approved',at:Date.now()-i*864e5})),apps:[],saved:[],seq:100};save()}
function save(){LS.s('hh',db)}let uid=LS.g('hhme',null);const me=()=>db.users.find(u=>u.id===uid&&!u.blocked)||null,nid=()=>++db.seq;
function toast(m){const t=$('#toast');t.textContent=m;t.className='on';clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',2400)}
const ago=t=>{const d=Math.max(0,Math.floor((Date.now()-t)/864e5));return d?d+'d ago':'Today'},go=h=>{location.hash=h};
function nav(){const u=me();$('#nav').innerHTML=`<a class="logo" href="#/"><img src="logo.png" alt="HireHub logo"><span>Hire<b>Hub</b></span></a><nav><a class="l" href="#/jobs">Find jobs</a><a class="l" href="#/jobs?type=Internship">Internships</a>${u&&u.role==='recruiter'?'<a class="l" href="#/post">Post a job</a>':''}</nav>${u?`<a class="l" href="#/dash">${E(u.name.split(' ')[0])} · ${u.role}</a><button class="btn s" onclick="out()">Log out</button>`:'<a class="l" href="#/login">Log in</a><a class="btn s" href="#/register">Join free</a>'}`}
function out(){uid=null;LS.s('hhme',null);go('#/');toast('Logged out')}
const live=()=>db.jobs.filter(j=>j.st==='approved'),card=j=>`<a class="card job" href="#/job/${j.id}"><div class="row"><span class="tag ${j.type==='Internship'?'i':''}">${j.type}</span><span class="tag">${j.mode}</span></div><h3 style="font-size:22px;margin:4px 0 0">${E(j.title)}</h3><div class="muted">${E(j.co)} · ${E(j.loc)}</div><div class="n" style="font-size:18px">${E(j.pay)}</div><div class="muted" style="font-size:13px">${E(j.skills.split(',').join(' · '))}</div><div class="muted" style="font-size:12px">${ago(j.at)}</div></a>`;
function home(){const L=live();return`<section class="hero"><div><span class="tag i">Jobs + internships, one place</span><h1 style="margin-top:14px">Work that <em>fits</em> you, found in minutes.</h1><p class="muted" style="font-size:18px;max-width:520px">Search verified roles, apply with a short note, and track every application. Hiring? Post a role and shortlist in one dashboard.</p>
<form class="search" onsubmit="event.preventDefault();go('#/jobs?q='+encodeURIComponent(this.q.value)+'&loc='+encodeURIComponent(this.l.value))"><input name="q" placeholder="Role, skill or company"><input name="l" placeholder="City or remote"><button class="btn d">Search</button></form>
<div class="row" style="margin-top:14px"><a class="btn s o" href="#/jobs?type=Internship">Internships</a><a class="btn s o" href="#/jobs?mode=Remote">Remote</a><a class="btn s o" href="#/jobs?type=Full-time">Full-time</a></div></div>
<div class="grid" style="grid-template-columns:1fr 1fr;gap:14px"><div class="stat"><span class="n">${L.length}</span>open roles</div><div class="stat"><span class="n">${L.filter(j=>j.type==='Internship').length}</span>internships</div><div class="stat"><span class="n">${new Set(L.map(j=>j.co)).size}</span>companies</div><div class="stat"><span class="n">${db.apps.length}</span>applications</div></div></section>
<h2>Fresh openings</h2><div class="grid">${L.slice(0,6).map(card).join('')}</div><p><a class="btn" href="#/jobs">Browse all jobs →</a></p>
<h2 style="margin-top:44px">How it works</h2><div class="grid">${[['01','Create your profile','Join as a job seeker or recruiter in under a minute.'],['02','Search and apply','Filter by type, mode and location, then apply with a note.'],['03','Track to offer','Watch status move from Applied to Hired in your dashboard.']].map(s=>`<div class="card"><span class="n" style="font-size:34px">${s[0]}</span><h3>${s[1]}</h3><p class="muted">${s[2]}</p></div>`).join('')}</div>
<div class="card" style="margin-top:44px;background:var(--p);color:var(--b)"><h2>Hiring? Post a role today.</h2><p>Reach candidates for jobs and internships. Admin-verified listings build trust.</p><a class="btn" href="#/register?r=recruiter">Start hiring</a></div>`}
function jobs(q){const t=q.get('q')||'',l=q.get('loc')||'',ty=q.get('type')||'',m=q.get('mode')||'';
const R=live().filter(j=>(!t||(j.title+j.co+j.skills).toLowerCase().includes(t.toLowerCase()))&&(!l||(j.loc+' '+j.mode).toLowerCase().includes(l.toLowerCase()))&&(!ty||j.type===ty)&&(!m||j.mode===m));
const sel=(n,o,v)=>`<select name="${n}"><option value="">All ${n==='type'?'types':'modes'}</option>${o.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('')}</select>`;
return`<h1 style="font-size:46px">Find your next role</h1><form class="search" onsubmit="event.preventDefault();const f=this,p=new URLSearchParams();['q','loc','type','mode'].forEach(k=>f[k].value&&p.set(k,f[k].value));go('#/jobs?'+p)"><input name="q" value="${E(t)}" placeholder="Role, skill or company"><input name="loc" value="${E(l)}" placeholder="Location"><div style="min-width:150px">${sel('type',['Full-time','Internship','Part-time','Contract'],ty)}</div><div style="min-width:130px">${sel('mode',['Remote','Hybrid','On-site'],m)}</div><button class="btn d">Filter</button></form>
<p class="muted"><span class="n">${R.length}</span> result${R.length===1?'':'s'}</p>${R.length?`<div class="grid">${R.map(card).join('')}</div>`:'<div class="card empty">No matching roles. Try fewer filters.</div>'}`}
function job(id){const j=db.jobs.find(x=>x.id==id),u=me();if(!j||(j.st!=='approved'&&!(u&&(u.role==='admin'||u.id===j.rid))))return'<div class="card empty">This job is not available.</div>';
const ap=u&&db.apps.find(a=>a.jobId===j.id&&a.uid===u.id),sv=u&&db.saved.some(s=>s.jobId===j.id&&s.uid===u.id);
return`<a href="#/jobs">← All jobs</a><div class="card" style="margin-top:12px"><div class="row"><span class="tag ${j.type==='Internship'?'i':''}">${j.type}</span><span class="tag">${j.mode}</span>${j.st!=='approved'?'<span class="tag r">Pending review</span>':''}</div><h1 style="font-size:44px;margin-top:10px">${E(j.title)}</h1><p class="muted">${E(j.co)} · ${E(j.loc)} · ${ago(j.at)}</p><div class="n" style="font-size:26px">${E(j.pay)}</div><h3 style="margin-top:20px">About the role</h3><p>${E(j.desc)}</p><h3>Skills</h3><div class="row">${j.skills.split(',').map(s=>`<span class="tag">${E(s.trim())}</span>`).join('')}</div>
<div class="row" style="margin-top:22px">${!u?`<a class="btn" href="#/login">Log in to apply</a>`:u.role==='seeker'?(ap?`<span class="tag i">Applied · ${ap.status}</span>`:`<button class="btn" onclick="$('#af').hidden=false;this.hidden=true">Apply now</button>`)+`<button class="btn o" onclick="sav(${j.id})">${sv?'★ Saved':'☆ Save'}</button>`:'<span class="muted">Switch to a job seeker account to apply.</span>'}</div>
<form id="af" hidden onsubmit="event.preventDefault();apply(${j.id},this.note.value)"><label>Short note to the recruiter</label><textarea name="note" rows="4" maxlength="600" required placeholder="Why are you a good fit?"></textarea><p><button class="btn d">Send application</button></p></form></div>`}
function apply(id,note){const u=me();if(!u||u.role!=='seeker')return;if(db.apps.some(a=>a.jobId===id&&a.uid===u.id))return toast('Already applied');db.apps.push({id:nid(),jobId:id,uid:u.id,note:note.trim(),status:'Applied',at:Date.now()});save();toast('Application sent!');render()}
function sav(id){const u=me(),i=db.saved.findIndex(s=>s.jobId===id&&s.uid===u.id);i<0?db.saved.push({jobId:id,uid:u.id}):db.saved.splice(i,1);save();render()}
function auth(mode,q){const reg=mode==='register';return`<form class="card f" onsubmit="event.preventDefault();${reg?'reg':'log'}(this)"><h2>${reg?'Create your account':'Welcome back'}</h2>${reg?`<label>Full name / company</label><input name="name" required maxlength="60"><label>I am a</label><select name="role"><option value="seeker">Job seeker</option><option value="recruiter" ${q.get('r')==='recruiter'?'selected':''}>Recruiter</option></select>`:''}<label>Email</label><input name="email" type="email" required><label>Password</label><input name="pw" type="password" required minlength="6"><p><button class="btn d" style="width:100%">${reg?'Join HireHub':'Log in'}</button></p>${reg?'<a href="#/login">Have an account? Log in</a>':`<a href="#/register">New here? Join free</a><p class="muted" style="font-size:12px">Demo: seeker@hirehub.app / seeker123 · recruiter@hirehub.app / recruit123 · admin@hirehub.app / admin123</p>`}</form>`}
function reg(f){const e=f.email.value.trim().toLowerCase();if(db.users.some(u=>u.email===e))return toast('Email already registered');const u={id:nid(),name:f.name.value.trim(),email:e,pw:f.pw.value,role:f.role.value};db.users.push(u);save();uid=u.id;LS.s('hhme',uid);toast('Welcome!');go('#/dash')}
function log(f){const u=db.users.find(x=>x.email===f.email.value.trim().toLowerCase()&&x.pw===f.pw.value);if(!u)return toast('Wrong email or password');if(u.blocked)return toast('Account blocked by admin');uid=u.id;LS.s('hhme',uid);toast('Logged in');go('#/dash')}
const pill=s=>`<span class="tag ${s==='Hired'||s==='Shortlisted'||s==='Interview'?'i':s==='Rejected'?'r':''}">${s}</span>`;
function dash(q){const u=me();if(!u)return auth('login',q);return u.role==='admin'?admin():u.role==='recruiter'?recr(u):seeker(u,q.get('t')||'apps')}
function seeker(u,t){const A=db.apps.filter(a=>a.uid===u.id),Sv=db.saved.filter(s=>s.uid===u.id).map(s=>db.jobs.find(j=>j.id===s.jobId)).filter(Boolean);
return`<h1 style="font-size:42px">Hi ${E(u.name.split(' ')[0])} 👋</h1><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(160px,1fr))">${[['Applied',A.length],['Shortlisted',A.filter(a=>['Shortlisted','Interview'].includes(a.status)).length],['Hired',A.filter(a=>a.status==='Hired').length],['Saved',Sv.length]].map(s=>`<div class="stat"><span class="n">${s[1]}</span>${s[0]}</div>`).join('')}</div>
<div class="tabs"><button class="${t==='apps'?'on':''}" onclick="go('#/dash?t=apps')">Applications</button><button class="${t==='saved'?'on':''}" onclick="go('#/dash?t=saved')">Saved jobs</button></div>
${t==='apps'?(A.length?`<div class="card"><table><tr><th>Role</th><th>Company</th><th>Status</th><th>Date</th><th></th></tr>${A.map(a=>{const j=db.jobs.find(x=>x.id===a.jobId);return j?`<tr><td><a href="#/job/${j.id}"><b>${E(j.title)}</b></a></td><td>${E(j.co)}</td><td>${pill(a.status)}</td><td>${ago(a.at)}</td><td>${a.status==='Applied'?`<button class="btn s x" onclick="wd(${a.id})">Withdraw</button>`:''}</td></tr>`:''}).join('')}</table></div>`:'<div class="card empty">No applications yet. <a href="#/jobs">Find a job</a></div>'):(Sv.length?`<div class="grid">${Sv.map(card).join('')}</div>`:'<div class="card empty">Nothing saved yet.</div>')}`}
function wd(id){db.apps=db.apps.filter(a=>a.id!==id);save();toast('Application withdrawn');render()}
function recr(u){const M=db.jobs.filter(j=>j.rid===u.id);return`<div class="row" style="justify-content:space-between"><h1 style="font-size:42px">Recruiter dashboard</h1><a class="btn" href="#/post">+ Post a job</a></div><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(160px,1fr))">${[['Jobs',M.length],['Live',M.filter(j=>j.st==='approved').length],['Pending',M.filter(j=>j.st==='pending').length],['Applicants',db.apps.filter(a=>M.some(j=>j.id===a.jobId)).length]].map(s=>`<div class="stat"><span class="n">${s[1]}</span>${s[0]}</div>`).join('')}</div>
<h2 style="margin-top:28px">Your listings</h2>${M.length?`<div class="card"><table><tr><th>Role</th><th>Type</th><th>Status</th><th>Applicants</th><th></th></tr>${M.map(j=>`<tr><td><a href="#/job/${j.id}"><b>${E(j.title)}</b></a></td><td>${j.type}</td><td>${j.st==='approved'?'<span class="tag i">Live</span>':'<span class="tag r">Pending</span>'}</td><td class="n">${db.apps.filter(a=>a.jobId===j.id).length}</td><td class="row"><a class="btn s" href="#/applicants/${j.id}">Applicants</a><button class="btn s x" onclick="del(${j.id})">Delete</button></td></tr>`).join('')}</table></div>`:'<div class="card empty">No listings yet.</div>'}`}
function del(id){if(!confirm('Delete this job and its applications?'))return;db.jobs=db.jobs.filter(j=>j.id!==id);db.apps=db.apps.filter(a=>a.jobId!==id);save();toast('Job deleted');render()}
function post(){const u=me();if(!u||u.role!=='recruiter')return'<div class="card empty">Log in as a recruiter to post jobs.</div>';const o=a=>a.map(x=>`<option>${x}</option>`).join('');
return`<form class="card f" style="max-width:640px" onsubmit="event.preventDefault();pub(this)"><h2>Post a job or internship</h2><label>Job title</label><input name="title" required maxlength="80"><label>Company</label><input name="co" required maxlength="60" value="${E(u.name)}"><div class="row"><div style="flex:1"><label>Type</label><select name="type">${o(['Full-time','Internship','Part-time','Contract'])}</select></div><div style="flex:1"><label>Mode</label><select name="mode">${o(['Remote','Hybrid','On-site'])}</select></div></div><label>Location</label><input name="loc" required maxlength="50"><label>Pay (e.g. ₹10–15 LPA or ₹20k/mo)</label><input name="pay" required maxlength="30"><label>Skills (comma separated)</label><input name="skills" required maxlength="100"><label>Description</label><textarea name="desc" rows="5" required maxlength="1200"></textarea><p class="muted" style="font-size:13px">New listings are reviewed by an admin before going live.</p><button class="btn d">Submit for review</button></form>`}
function pub(f){const u=me();db.jobs.unshift({id:nid(),rid:u.id,title:f.title.value.trim(),co:f.co.value.trim(),type:f.type.value,mode:f.mode.value,loc:f.loc.value.trim(),pay:f.pay.value.trim(),skills:f.skills.value.trim(),desc:f.desc.value.trim(),st:'pending',at:Date.now()});save();toast('Submitted for admin review');go('#/dash')}
function applicants(id){const u=me(),j=db.jobs.find(x=>x.id==id);if(!u||!j||(j.rid!==u.id&&u.role!=='admin'))return'<div class="card empty">Not allowed.</div>';const A=db.apps.filter(a=>a.jobId===j.id);
return`<a href="#/dash">← Dashboard</a><h1 style="font-size:38px;margin-top:10px">Applicants · ${E(j.title)}</h1>${A.length?`<div class="card"><table><tr><th>Candidate</th><th>Note</th><th>Applied</th><th>Status</th></tr>${A.map(a=>{const c=db.users.find(x=>x.id===a.uid)||{name:'Deleted',email:''};return`<tr><td><b>${E(c.name)}</b><br><span class="muted">${E(c.email)}</span></td><td>${E(a.note)}</td><td>${ago(a.at)}</td><td><select onchange="setst(${a.id},this.value)">${['Applied','Shortlisted','Interview','Hired','Rejected'].map(s=>`<option ${s===a.status?'selected':''}>${s}</option>`).join('')}</select></td></tr>`}).join('')}</table></div>`:'<div class="card empty">No applicants yet.</div>'}`}
function setst(id,s){db.apps.find(a=>a.id===id).status=s;save();toast('Status updated')}
function admin(){const P=db.jobs.filter(j=>j.st==='pending');return`<h1 style="font-size:42px">Admin console</h1><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(160px,1fr))">${[['Users',db.users.length],['Jobs',db.jobs.length],['Pending',P.length],['Applications',db.apps.length]].map(s=>`<div class="stat"><span class="n">${s[1]}</span>${s[0]}</div>`).join('')}</div>
<h2 style="margin-top:28px">Awaiting approval</h2>${P.length?`<div class="card"><table><tr><th>Role</th><th>Company</th><th>Type</th><th></th></tr>${P.map(j=>`<tr><td><a href="#/job/${j.id}"><b>${E(j.title)}</b></a></td><td>${E(j.co)}</td><td>${j.type}</td><td class="row"><button class="btn s" onclick="ap(${j.id},1)">Approve</button><button class="btn s x" onclick="ap(${j.id},0)">Reject</button></td></tr>`).join('')}</table></div>`:'<div class="card empty">All caught up 🎉</div>'}
<h2 style="margin-top:28px">Users</h2><div class="card"><table><tr><th>Name</th><th>Email</th><th>Role</th><th></th></tr>${db.users.map(x=>`<tr><td>${E(x.name)}</td><td>${E(x.email)}</td><td>${x.role}</td><td>${x.role==='admin'?'':`<button class="btn s ${x.blocked?'':'x'}" onclick="blk(${x.id})">${x.blocked?'Unblock':'Block'}</button>`}</td></tr>`).join('')}</table></div>
<h2 style="margin-top:28px">Live jobs</h2><div class="card"><table><tr><th>Role</th><th>Company</th><th>Type</th><th></th></tr>${live().map(j=>`<tr><td>${E(j.title)}</td><td>${E(j.co)}</td><td>${j.type}</td><td><button class="btn s x" onclick="del(${j.id})">Remove</button></td></tr>`).join('')}</table></div>`}
function ap(id,ok){if(ok)db.jobs.find(j=>j.id===id).st='approved';else db.jobs=db.jobs.filter(j=>j.id!==id);save();toast(ok?'Job approved':'Job rejected');render()}
function blk(id){const x=db.users.find(u=>u.id===id);x.blocked=!x.blocked;save();render()}
function render(){nav();const h=location.hash.slice(1)||'/',[p,qs]=h.split('?'),q=new URLSearchParams(qs||''),s=p.split('/');let v;
try{v=p==='/'?home():p==='/jobs'?jobs(q):s[1]==='job'?job(s[2]):p==='/login'?auth('login',q):p==='/register'?auth('register',q):p==='/dash'?dash(q):p==='/post'?post():s[1]==='applicants'?applicants(s[2]):'<div class="card empty"><h2>Page not found</h2><a href="#/">Go home</a></div>'}catch(e){console.error(e);v='<div class="card empty">Something went wrong. <a href="#/">Go home</a></div>'}
$('#app').innerHTML=v;if(!render.k)scrollTo(0,0)}
addEventListener('hashchange',()=>{render.k=0;render()});render();
</script></body></html>
