<!doctype html>
<html lang="en">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Primary Meta Tags -->
    <title>HireHub — Global Job Portal & Recruitment SaaS</title>
    <meta name="title" content="HireHub — Global Job Portal & Recruitment SaaS" />
    <meta name="description" content="Find verified worldwide tech jobs, apply with ATS resume matching, build professional resumes and connect with top employers." />
    <meta name="theme-color" content="#7C3AED" />

    <!-- Mobile & PWA Application Meta -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HireHub" />
    <meta name="application-name" content="HireHub" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hirehub.app/" />
    <meta property="og:title" content="HireHub — Global Job Portal & Career Discovery" />
    <meta property="og:description" content="Browse verified career openings, analyze ATS resume compatibility, and hire top engineering talent." />
    <meta property="og:image" content="/favicon.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="HireHub — Global Job Portal & Career Discovery" />
    <meta property="twitter:description" content="Browse verified career openings, analyze ATS resume compatibility, and hire top engineering talent." />
    <meta property="twitter:image" content="/favicon.png" />
    <!-- figma:head-end -->
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Service Worker Registration for PWA / Mobile Install -->
    <script>
      if ('serviceWorker' in navigator && window.location.protocol === 'https:') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
    <!-- figma:body-end -->
  </body>
</html>
