{% extends 'base.html' %}
{% block content %}
<section class="container" style="padding: 80px 20px; max-width: 520px;">
    <div class="card animate-fade-up">
        <h2 class="card-title" style="font-size: 24px; text-align: center; margin-bottom: 24px;">Create an Account</h2>
        
        {% if messages %}
            {% for message in messages %}
                <div class="badge badge-danger" style="margin-bottom: 16px; width: 100%; justify-content: center;">{{ message }}</div>
            {% endfor %}
        {% endif %}
        
        <form method="POST">
            {% csrf_token %}
            <div class="field">
                <label>Username</label>
                <input type="text" name="username" required>
            </div>
            <div class="field">
                <label>Email Address</label>
                <input type="email" name="email" required>
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>
            <div class="field">
                <label>I am a:</label>
                <select name="role">
                    <option value="candidate">Candidate (Looking for jobs)</option>
                    <option value="recruiter">Recruiter (Hiring for my company)</option>
                </select>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 16px;">Sign Up</button>
        </form>
        
        <p style="text-align: center; margin-top: 24px; font-size: 14px;">Already have an account? <a href="{% url 'login' %}">Login here</a></p>
    </div>
</section>
{% endblock %}
